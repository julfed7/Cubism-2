name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: "4.7.2"
          use-dotnet: false
          include-templates: true

      - name: Restore Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "Keystore restored."

      - name: Configure Keystore in export preset
        run: |
          sed -i "s|keystore/release=\".*\"|keystore/release=\"$(pwd)/release.keystore\"|g" export_presets.cfg
          sed -i "s|keystore/release_user=\".*\"|keystore/release_user=\"${{ secrets.ANDROID_KEY_ALIAS }}\"|g" export_presets.cfg
          sed -i "s|keystore/release_password=\".*\"|keystore/release_password=\"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}\"|g" export_presets.cfg
          echo "Keystore paths configured."

      - name: Auto-increment version code
        run: |
          VERSION_CODE=$(date -u +%Y%m%d%H%M)
          sed -i "s/^version\/code=.*/version\/code=${VERSION_CODE}/g" export_presets.cfg
          echo "Version code set to ${VERSION_CODE}"

      - name: Import Project
        run: godot --headless --import

      - name: Build Android APK
        run: |
          mkdir -p builds
          godot --headless --export-release "Android" builds/game.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          # Каждый push создаёт новый тег release-N, где N — номер запуска
          tag_name: release-${{ github.run_number }}
          name: Release #${{ github.run_number }} — ${{ github.event.head_commit.message }}
          generate_release_notes: true
          files: builds/game.apk
